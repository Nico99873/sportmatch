function hav(la1,lo1,la2,lo2){const R=6371,a=Math.sin((la2-la1)*Math.PI/360)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin((lo2-lo1)*Math.PI/360)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function geo(la,lo){
  return {x:(lo-LONMIN)/(LONMAX-LONMIN)*W, y:(1-(la-LATMIN)/(LATMAX-LATMIN))*H};
}

function drawMap(){
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle='#dce8d0'; ctx.fillRect(0,0,W,H);

  for(let y=0;y<H;y+=22){ctx.strokeStyle='#c8dab8';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let x=0;x<W;x+=22){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  function river(pts,w1,c1,w2,c2){
    const pp=pts.map(([la,lo])=>geo(la,lo));
    ctx.beginPath();pp.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.strokeStyle=c1;ctx.lineWidth=w1;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    ctx.beginPath();pp.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.strokeStyle=c2;ctx.lineWidth=w2;ctx.stroke();
  }

    ctx.beginPath();pp.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));

  road([[45.810,11.728],[45.790,11.730],[45.773,11.732],[45.760,11.734],[45.750,11.737],[45.740,11.744],[45.730,11.754],[45.720,11.763],[45.710,11.768],[45.700,11.770],[45.690,11.765],[45.680,11.762],[45.670,11.762],[45.660,11.762],[45.651,11.780],[45.641,11.785]],9,'#fff',6,'#f0a030');
  road([[45.768,11.620],[45.762,11.650],[45.758,11.680],[45.755,11.710],[45.752,11.735],[45.748,11.760],[45.744,11.800],[45.740,11.830]],6,'#fff',4,'#e8e0c0');

  const towns=[

  towns.forEach(t=>{

  ctx.font='bold 9px system-ui';ctx.fillStyle='#333';ctx.textAlign='center';ctx.fillText('N',ax,ay+21);

function getClickedASD(x,y){
  let best=null,bd=20;
  DATA.forEach(a=>{
    if(curSport!=='tutti'&&a.s!==curSport)return;
    const p=geo(a.la,a.lo);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=a;}
  });
  return best;
}

function renderList(){
  const list=document.getElementById('list');
  const profile=document.getElementById('profile');
  list.style.display='block';
  profile.classList.remove('vis');

  let d=DATA.map(a=>({...a,dist:hav(ULA,ULO,a.la,a.lo)})).sort((a,b)=>a.dist-b.dist);
  const q=document.getElementById('qi').value.toLowerCase();
  if(curSport!=='tutti') d=d.filter(a=>a.s===curSport);
  if(q) d=d.filter(a=>a.n.toLowerCase().includes(q)||SL[a.s].toLowerCase().includes(q));

  document.getElementById('cnt').textContent=`${d.length} societ${d.length===1?'à':'à'}`;
  list.innerHTML=d.map(a=>`
    <div class="ac${selId===a.id?' sel':''}" onclick="openProfile(${a.id})">
      <div class="at"><div class="an">${a.n}</div><span class="ab" style="background:${SC[a.s]}">${SL[a.s]}</span></div>
      <div class="am"><span class="sg">${st(a.r)}</span><span>${a.r.toFixed(1)} (${a.rc})</span><span style="color:var(--color-text-tertiary)">· ${fd(a.dist)}</span></div>
    </div>
  `).join('');
  drawMap();
}

function openProfile(id){
  selId=id;
  const a=DATA.find(x=>x.id===id);
  document.getElementById('list').style.display='none';
  const prof=document.getElementById('profile');
  prof.classList.add('vis');

  const cov=document.getElementById('pcov');
  cov.style.background=SC[a.s];
  cov.innerHTML=`<span style="background:rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500">${SE[a.s]} ${SL[a.s]}</span>`;
  document.getElementById('pname').textContent=a.n;
  document.getElementById('prat').innerHTML=`<span style="color:#BA7517">${st(a.r)}</span><span>${a.r.toFixed(1)}</span><span style="color:var(--color-text-tertiary)">(${a.rc} recensioni)</span>`;
  document.getElementById('pinfos').innerHTML=[
    {i:'📍',v:a.a},{i:'🕐',v:a.h},{i:'👶',v:a.e},{i:'💶',v:a.q},{i:'📝',v:a.d}
  ].map(r=>`<div class="ir"><span class="ii">${r.i}</span><span class="iv">${r.v}</span></div>`).join('');
  document.getElementById('prevs').innerHTML=a.rv.map(r=>`
    <div class="rc"><div class="rh"><span class="ru">${r.u}</span><span style="display:flex;gap:4px;align-items:center"><span style="color:#BA7517;font-size:11px">${'★'.repeat(r.st)}</span><span class="rd">${r.dt}</span></span></div><div class="rt">"${r.t}"</div></div>
  `).join('');
  prof.scrollTop=0;
  drawMap();
}

window.addEventListener('load',()=>{
  canvas=document.getElementById('mc');
  ctx=canvas.getContext('2d');
  const mw=document.getElementById('mapwrap');
  function resize(){
    W=mw.clientWidth;H=mw.clientHeight;
    canvas.width=W;canvas.height=H;
    drawMap();
  }
  resize();
  new ResizeObserver(resize).observe(mw);

  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect();
    const a=getClickedASD(e.clientX-r.left,e.clientY-r.top);
    if(a){openProfile(a.id);document.getElementById('list').style.display='none';}
  });
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    const a=getClickedASD(e.clientX-r.left,e.clientY-r.top);
    canvas.style.cursor=a?'pointer':'default';
  });

  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    c.style.background=CHIP_BG[c.dataset.s]||'';
    document.querySelectorAll('.chip:not(.on)').forEach(x=>x.style.background='');
    curSport=c.dataset.s;selId=null;renderList();
  }));

  document.getElementById('qi').addEventListener('input',()=>{selId=null;renderList();});
  document.getElementById('pb').addEventListener('click',()=>{selId=null;renderList();});
  document.getElementById('cbtn').addEventListener('click',()=>{const a=DATA.find(x=>x.id===selId);if(a)alert('Funzione disponibile nella versione completa.\nContatteresti:\n'+a.n);});

  renderList();
});
</script>
